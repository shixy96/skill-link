name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build macOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: node scripts/validate-release.mjs "${{ inputs.version }}"

      - name: Build release
        run: npm run release:build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skilllink-v${{ inputs.version }}-macos
          path: |
            release/*.zip
            release/*.zip.blockmap
          if-no-files-found: error
